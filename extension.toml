id = "wdl"
name = "Workflow Description Language"
version = "0.1.0"
schema_version = 1
authors = [
  "Lucas van Dijk <lvandijk@broadinstitute.org>",
  "Sage Wright <sage.wright@theiagen.com>",
]
description = "WDL 1.0–1.3 support: syntax highlighting with embedded bash/Python/R in command blocks, outline, and Sprocket LSP diagnostics."
repository = "https://github.com/broadinstitute/zed-wdl"

[grammars.wdl]
repository = "https://github.com/sage-wright/tree-sitter-wdl"
commit = "1674d539baf7ee4b5fb65be830e169ae35421c9b"

[language_servers.sprocket]
languages = ["WDL"]
name = "Sprocket"

[language_servers.wdl-command-lint]
languages = ["WDL"]
name = "WDL command linters (ShellCheck, Ruff)"

[[capabilities]]
kind = "process:exec"
command = "*"
args = ["--version"]

[[capabilities]]
kind = "download_file"
host = "github.com"
path = ["stjude-rust-labs", "sprocket", "**"]

[[capabilities]]
kind = "download_file"
host = "github.com"
path = ["koalaman", "shellcheck", "**"]

[[capabilities]]
kind = "download_file"
host = "github.com"
path = ["astral-sh", "ruff", "**"]
